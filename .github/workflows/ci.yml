name: CI

on:
  # Every branch, not just main and open PRs. Work pushed to a branch with no
  # PR attached was getting no CI at all, which is exactly when you least want
  # to find out the target Python version broke something.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (`contextlib.aclosing`, `zip(strict=)`). 3.14 is
        # the one that matters: a current Termux install reports SOABI
        # cpython-314-aarch64-linux-android, so that is what this actually
        # runs on in production. Testing only the versions that were
        # convenient left the target platform uncovered.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check raxit tests

      - name: Test
        # No API key in the environment: the suite must never reach a real
        # endpoint, and a test that would is a test that fails here.
        run: pytest --cov=raxit --cov-report=term-missing

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck the install and run scripts
        # These only ever execute on a tablet, where a syntax error surfaces
        # as a half-finished install with no Python and no venv.
        run: shellcheck --shell=bash scripts/*.sh
