[pytest]
testpaths = tests
# Nearly every test here drives an async agent loop, so opting each one in
# individually is noise; asyncio_mode=auto collects bare `async def` tests.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:raxit.*
